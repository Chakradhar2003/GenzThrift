{% extends "../base.html" %}
{% load static %}

{% block main_body %}
<section class="py-5" style="background: #f7f4ee; min-height: 100vh;">
	<div class="container">
		<div class="mb-4 pb-3 border-bottom">
			<p class="text-uppercase fw-bold mb-1" style="letter-spacing: .14em; color: #8a6f55; font-size: 12px;">Sell</p>
			<h1 class="mb-2">ADD ITEM</h1>
			<p class="mb-0 text-muted">Upload images first, then let AI help draft the listing.</p>
		</div>

		<form method="post" enctype="multipart/form-data" id="add-item-form" data-analyze-url="{% url 'analyze_item_draft' %}">
			{% csrf_token %}

			<div class="row g-4">
				<div class="col-12">
					<label class="form-label fw-semibold">Upload images</label>
					<input type="file" name="images" id="item-images" class="form-control" multiple>
					<small class="text-muted d-block mt-2">Add one or more photos of the item.</small>
				</div>

				<div class="col-12">
					<button type="button" id="generate-draft-btn" class="btn btn-dark px-4">
						Generate AI Draft
					</button>
					<div id="ai-draft-status" class="small text-muted"></div>
				</div>

				<div class="col-12">
					<div class="border rounded-3 p-4" style="background: #f7f4ee;">
						<h2 class="h5 mb-3">AI Suggestions</h2>

						<div class="row g-3">
							<div class="col-md-6">
								<label class="form-label">Title</label>
								<input type="text" name="title" id="draft-title" class="form-control" placeholder="AI will suggest a title">
							</div>

							<div class="col-md-6">
								<label class="form-label">Category</label>
								<select name="category" id="draft-category" class="form-select">
									<option value="">Select category</option>
									<option value="clothes">Clothing</option>
									<option value="footwear">Footwear</option>
									<option value="accessories">Accessories</option>
								</select>
							</div>

							<div class="col-md-6">
								<label class="form-label">Condition</label>
								<select name="condition" id="draft-condition" class="form-select">
									<option value="">Select condition</option>
									<option value="new">New</option>
									<option value="like_new">Like New</option>
									<option value="good">Good</option>
									<option value="fair">Fair</option>
									<option value="used">Used</option>
								</select>
							</div>

							<div class="col-md-6">
								<label class="form-label">Price</label>
								<input type="number" name="price" class="form-control" min="1" step="0.01" placeholder="Enter price">
							</div>

							<div class="col-12">
								<label class="form-label">Description</label>
								<textarea name="description" id="draft-description" class="form-control" rows="5" placeholder="AI will suggest a description"></textarea>
							</div>

							<div class="col-md-6">
								<label class="form-label">Brand</label>
								<input type="text" name="brand" class="form-control" placeholder="Optional">
							</div>

							<div class="col-md-6">
								<label class="form-label">Size</label>
								<input type="text" name="size" class="form-control" placeholder="Optional">
							</div>
						</div>
					</div>
				</div>

				<div class="col-12">
					<button type="submit" class="btn btn-dark px-4">
						Save Item
					</button>
				</div>
			</div>
		</form>
	</div>
</section>

<script>
	document.addEventListener('DOMContentLoaded', function () {
		const form = document.getElementById('add-item-form');
		const analyzeUrl = form.dataset.analyzeUrl;
		const imageInput = document.getElementById('item-images');
		const button = document.getElementById('generate-draft-btn');
		const statusBox = document.getElementById('ai-draft-status');

		function setField(id, value) {
			const el = document.getElementById(id);
			if(el) el.value = value;
		}

		function getCsrfToken() {
			return form.querySelector('[name=csrfmiddlewaretoken]').value;
		}

		button.addEventListener('click', async function () {
			if (!imageInput.files.length) {
				statusBox.textContent = 'Please upload at least one image first.';
    			return;
			}

			const formData = new FormData();
			for (const file of imageInput.files) {
				formData.append('images', file);
			}
			statusBox.textContent = 'Analyzing images...';

			const response = await fetch(analyzeUrl, {
				method: 'POST',
				headers: { 'X-CSRFToken': getCsrfToken() },
				body: formData,
			});

			const data = await response.json();
			if (!response.ok) {
				statusBox.textContent = data.error || 'Could not generate draft.';
				return;
			}

			setField('draft-title', data.title);
			setField('draft-description', data.description);
			setField('draft-category', data.category);
			setField('draft-condition', data.condition);

			statusBox.textContent = 'Draft generated.';
		
	 	});
	});
</script>

{% endblock %}
